name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the older run for it; pushes to branches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node24-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: Install pinned development tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build for Node 24 compatibility
        run: npm run build && npm run build:tests
      - name: Verify Node 24 imports and process behavior
        run: npm run verify-node24
      - name: Run Node conformance on Node 24
        run: npm run test:node

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js 26.11.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Set up Bun 1.4.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install pinned development tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck source, harnesses, scripts, and tests
        run: npm run typecheck
      - name: Lint selected repository scope
        run: npm run lint
      - name: Check formatting without writing
        run: npm run format:check
      - name: Reject unsafe release inputs and incomplete CI evidence
        run: npm run test:release
      - name: Independently replay the current-base release PR
        if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
        run: npm run release:check-pr
      - name: Run shared Node and Bun conformance
        run: npm test
      - name: Run Node adapter suites inside Bun
        run: npm run test:node-under-bun
      - name: Pack exact release candidate
        run: npm run pack
      - name: Qualify fresh installed consumers
        run: npm run qualify
      - name: Retain tarball and hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-or-bun-${{ matrix.os }}
          path: .worker-tmp/pack/
          if-no-files-found: error

  package-artifact:
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 26.11.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Set up Bun 1.4.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install pinned development tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and pack exact release candidate
        run: npm run build && npm run pack
      - name: Upload exact tarball and hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-or-bun-release-candidate
          path: .worker-tmp/pack/
          if-no-files-found: error
      - name: Pack unsupported namespace bootstrap
        run: node scripts/pack-namespace-bootstrap.ts
      - name: Upload unsupported namespace bootstrap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-runtime-namespace-bootstrap
          path: .worker-tmp/bootstrap-pack/
          if-no-files-found: error
