name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 26.11.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Set up Bun 1.4.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install pinned development tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck source, harnesses, scripts, and tests
        run: npm run typecheck
      - name: Run shared Node and Bun conformance
        run: npm test
      - name: Pack exact release candidate
        run: npm run pack
      - name: Qualify fresh installed consumers
        run: npm run qualify
      - name: Retain tarball and hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-runtime-${{ matrix.os }}
          path: .worker-tmp/pack/
          if-no-files-found: error

  package-artifact:
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 26.11.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Set up Bun 1.4.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install pinned development tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and pack exact release candidate
        run: npm run build && npm run pack
      - name: Upload exact tarball and hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-runtime-release-candidate
          path: .worker-tmp/pack/
          if-no-files-found: error
