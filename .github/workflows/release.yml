name: release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: node-or-bun-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 26.11.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Set up Bun 1.4.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install pinned development tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify the reviewed package
        run: npm run check
      - name: Publish through GitHub OIDC Trusted Publisher
        run: |
          set -- .worker-tmp/pack/*.tgz
          test "$#" -eq 1
          npm publish "$1" --access public --provenance
